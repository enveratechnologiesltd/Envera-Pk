name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: siteground-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 18765 -H "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Upload files
        run: |
          rsync -rlvz --delete \
            --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/deploy_key -p 18765 -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_PATH }}/"
